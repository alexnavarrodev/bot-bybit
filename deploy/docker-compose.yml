services:
  shadow-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bot-bybit-shadow
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    command: ["python", "scripts/run_shadow.py"]

