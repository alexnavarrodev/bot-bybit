services:
  postgres:
    image: postgres:16-alpine
    container_name: bot-bybit-postgres
    restart: unless-stopped
    # env_file carga POSTGRES_USER/PASSWORD/DB directamente en el contenedor,
    # sin depender de la interpolación ${...} de compose (que busca un .env
    # junto al fichero compose y no en la raíz del repo). Así el usuario/clave
    # con los que Postgres se INICIALIZA siempre coinciden con DATABASE_URL.
    env_file:
      - ../.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # $$ escapa la variable para que la expanda el shell DENTRO del contenedor
      # (usando el env cargado por env_file), no la interpolación de compose.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-botbybit}"]
      interval: 5s
      timeout: 5s
      retries: 10

  shadow-bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bot-bybit-shadow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    command: ["python", "scripts/run_shadow.py"]

  dashboard:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: bot-bybit-dashboard
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    ports:
      - "8080:8080"
    command: ["uvicorn", "src.dashboard.app:app", "--host", "0.0.0.0", "--port", "8080"]

  # Descomenta cuando hayas validado la estrategia en shadow y quieras operar en real.
  # live-bot:
  #   build:
  #     context: ..
  #     dockerfile: deploy/Dockerfile
  #   container_name: bot-bybit-live
  #   restart: unless-stopped
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   env_file:
  #     - ../.env
  #   volumes:
  #     - ../data:/app/data
  #   command: ["python", "scripts/run_live.py", "--i-understand-the-risk"]

volumes:
  pgdata:
